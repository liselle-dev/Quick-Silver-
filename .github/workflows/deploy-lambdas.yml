name: Build & Deploy Lambdas

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Update EditProfile-Lambda
      run: |
        aws lambda update-function-code \
          --function-name EditProfile-Lambda \
          --zip-file fileb://target/edit-profile-lambda-1.0-SNAPSHOT.jar

    - name: Update TollNotification_Lambda
      run: |
        aws lambda update-function-code \
          --function-name TollNotification_Lambda \
          --zip-file fileb://target/edit-profile-lambda-1.0-SNAPSHOT.jar

    - name: Update LambdaSignUp_Function
      run: |
        aws lambda update-function-code \
          --function-name LambdaSignUp_Function \
          --zip-file fileb://target/edit-profile-lambda-1.0-SNAPSHOT.jar

    - name: Update PaymentProcesser_Lambda
      run: |
        aws lambda update-function-code \
          --function-name PaymentProcesser_Lambda \
          --zip-file fileb://target/edit-profile-lambda-1.0-SNAPSHOT.jar

    - name: Update Sign-InLambdaFunction
      run: |
        aws lambda update-function-code \
          --function-name Sign-InLambdaFunction \
          --zip-file fileb://target/edit-profile-lambda-1.0-SNAPSHOT.jar
